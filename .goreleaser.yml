version: 2

env:
  - CGO_ENABLED=0
  - PROJECT=github.com/proximile/proxiport-pairing
builds:
  - id: proxiport-pairing
    main: ./cmd/proxiport-pairing
    ldflags:
      - "-s -w -X main.Version={{.Version}}"
    binary: proxiport-pairing
    # Reproducible builds: -trimpath strips local paths; mod_timestamp pins the
    # embedded build time to the commit's so a tag rebuilds byte-for-byte.
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    # Explicit, build-verified target list (the service is CGO-free). A
    # server-oriented spread — common server arches plus the two BSDs people run
    # infra on. Every entry is present in `go tool dist list`.
    targets:
      - linux_386
      - linux_amd64
      - linux_arm_6
      - linux_arm_7
      - linux_arm64
      - linux_riscv64
      - linux_ppc64le
      - linux_s390x
      - freebsd_amd64
      - freebsd_arm64
      - openbsd_amd64
      - openbsd_arm64
archives:
  - id: proxiport-pairing
    name_template: >-
      proxiport-pairing_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    ids:
      - proxiport-pairing
    files:
      - proxiport-pairing.conf.example
      - proxiport-pairing.service
      - LICENSE
      - LICENSE-MIT
      - NOTICE
      - README.md
nfpms:
  - id: proxiport-pairing
    package_name: proxiport-pairing
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    ids:
      - proxiport-pairing
    vendor: Proximile LLC
    homepage: https://github.com/proximile/proxiport-pairing
    maintainer: Proximile LLC <191914090+proximile@users.noreply.github.com>
    description: |-
      ProxiPort pairing service. Mints one-shot installer codes that an
      agent host curls to bring up a ProxiPort agent with its
      credentials, fingerprint, and connect URL pre-baked. Stateless,
      binds to localhost — front with a TLS-terminating reverse proxy.
    license: AGPL-3.0-or-later
    section: net
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./proxiport-pairing.conf.example
        dst: /etc/proxiport/proxiport-pairing.conf.example
        type: config|noreplace
      - src: ./opt/systemd/proxiport-pairing.service
        dst: /lib/systemd/system/proxiport-pairing.service
      - src: ./LICENSE
        dst: /usr/share/doc/proxiport-pairing/LICENSE
      - src: ./LICENSE-MIT
        dst: /usr/share/doc/proxiport-pairing/LICENSE-MIT
      - src: ./NOTICE
        dst: /usr/share/doc/proxiport-pairing/NOTICE
      - src: ./README.md
        dst: /usr/share/doc/proxiport-pairing/README.md
    scripts:
      preinstall: ./opt/packaging/preinstall.sh
      postinstall: ./opt/packaging/postinstall.sh
      preremove: ./opt/packaging/preremove.sh
      postremove: ./opt/packaging/postremove.sh
    overrides:
      deb:
        dependencies:
          - libc6
      rpm:
        dependencies:
          - glibc
checksum:
  name_template: 'checksums.txt'

# Keyless Sigstore signature over the checksums file. Every artifact's hash is
# listed in checksums.txt, so one signature over it transitively covers all
# release artifacts. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/proximile/proxiport-pairing' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
# Requires cosign on PATH and `id-token: write` in the release workflow.
signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

# Per-artifact SBOMs (Syft) covering both archives and the deb/rpm packages.
sboms:
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package

snapshot:
  version_template: "{{ .Tag }}"
changelog:
  sort: asc
release:
  github:
    owner: proximile
    name: proxiport-pairing
  draft: false
  prerelease: false
