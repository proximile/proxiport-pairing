version: 2

env:
  - CGO_ENABLED=0
  - PROJECT=github.com/proximile/proxiport-pairing
builds:
  - id: proxiport-pairing
    main: ./cmd/proxiport-pairing
    ldflags:
      - "-s -w -X main.Version={{.Version}}"
    binary: proxiport-pairing
    goos:
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - id: proxiport-pairing
    name_template: >-
      proxiport-pairing_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end}}
    ids:
      - proxiport-pairing
    files:
      - proxiport-pairing.conf.example
      - proxiport-pairing.service
      - LICENSE
      - LICENSE-MIT
      - NOTICE
      - README.md
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}"
changelog:
  sort: asc
release:
  github:
    owner: proximile
    name: proxiport-pairing
  draft: false
  prerelease: true
