name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required for keyless Sigstore signing (cosign requests an OIDC token from
  # the Actions provider to obtain a short-lived Fulcio certificate).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fetch-depth: 0 is required for the change log to work correctly.
          # See https://goreleaser.com/ci/actions/
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          # No build cache in the release job: a cache entry written by an
          # earlier workflow run must not feed the binaries we sign.
          cache: false

      # Gate the release on a call-graph-aware vulnerability scan so a tag can
      # never ship binaries built against a reachable known-vulnerable dep/stdlib.
      - name: govulncheck (dependency vulnerability scan)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # cosign signs the checksums file (keyless); syft generates the SBOMs.
      # Both must be on PATH before goreleaser runs its signs/sboms steps.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.57.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.20.0"
          args: release --clean
        env:
          # Use a fine-grained PAT (RELEASE_PAT, scoped contents: write
          # on this repo) instead of GITHUB_TOKEN so the release-published
          # event propagates to the downstream deploy-pairing workflow.
          # Workflows triggered by GITHUB_TOKEN cannot trigger further
          # workflows — that's the documented anti-loop guard. Falls back
          # to GITHUB_TOKEN on forks / dispatch where RELEASE_PAT is
          # absent, so the release still cuts.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # Auto-deploy to pairing.proxiport.net runs in a separate
      # workflow (deploy-pairing.yml) on the `release: published`
      # event, so it doesn't gate the release if the deploy host
      # is unreachable.
