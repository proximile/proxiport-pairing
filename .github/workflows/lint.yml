name: Lint
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'

      - name: golangci-lint
        # v6 + "latest" resolves to the golangci-lint v1 series, which is
        # built with Go 1.24 and refuses go.mod >= 1.25. Pin the same
        # action + version the main proxiport repo uses.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
