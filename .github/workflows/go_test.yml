name: Go Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: the test job only needs to read the checkout.
permissions:
  contents: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'

      # TestLinuxScriptsPassShellcheck skips when the tool is absent, so without
      # this the shell-script half of the suite would quietly check nothing.
      # The Windows scripts get a whole windows-latest job; the Linux ones got a
      # single textual assertion until these tests were added.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Go Test
        run: go test -race ./...

      # The pairing daemon is internet-facing and must not share an account
      # with the ProxiPort server: while it did, a compromise of this service
      # on a co-hosted box reached proxiportd.conf (jwt_secret, key_seed) and
      # every database under /var/lib/proxiport. This runs the real maintainer
      # scripts in a container and asserts that boundary. It refuses to skip.
      - name: packaging account separation
        run: bash opt/packaging/account_test.sh

      # Known-vulnerability scan of the module (deps + the Go stdlib version).
      # govulncheck is call-graph aware, so it only fails on vulns actually
      # reachable from our code.
      #
      # The scanner is pinned; the vulnerability database is not. govulncheck
      # fetches the database at run time, so a pinned scanner still sees
      # newly-disclosed vulnerabilities, and a newly-disclosed reachable one can
      # still turn main red with no code change — intended.
      #
      # It used to be @latest, which is remote code resolved at run time in a
      # job that gates every merge. That broke this repo's CI outright when
      # x/vuln v1.8.0 raised its Go requirement to 1.26 while setup-go pins
      # GOTOOLCHAIN=local: the gate failed for a reason that had nothing to do
      # with the code under test. Bump this deliberately.
      - name: govulncheck (dependency vulnerability scan)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
