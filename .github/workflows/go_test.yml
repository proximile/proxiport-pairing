name: Go Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'

      - name: Go Test
        run: go test -race ./...

      # Known-vulnerability scan of the module (deps + the Go stdlib version).
      # govulncheck is call-graph aware, so it only fails on vulns actually
      # reachable from our code. @latest tracks the newest scanner + Go vuln DB.
      # A newly-disclosed reachable vuln can turn main red with no code change —
      # intended; move to a scheduled run if it ever proves disruptive.
      - name: govulncheck (dependency vulnerability scan)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
